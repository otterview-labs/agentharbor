name: Desktop build and smoke
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:desktop
      - run: npm run build:desktop
      - name: Install Linux Electron test dependencies
        if: runner.os == 'Linux'
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends xauth
      - name: Native Electron smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop
      - name: Native Electron smoke (Windows, repeated to exercise snapshot replacement)
        if: runner.os == 'Windows'
        run: npm run test:desktop -- --repeat-each=3
      - name: Native Electron smoke (macOS)
        if: runner.os == 'macOS'
        run: npm run test:desktop
      - name: Package desktop zip
        run: npm run package:desktop
      - name: Launch extracted release ZIP (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:package
      - name: Launch extracted release ZIP (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:package
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: AgentHarbor-${{ runner.os }}
          path: release/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-failures-${{ runner.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
